name: 🛡 Posting SLO Watchdog

# 投稿 SLO 保証 — config/posting_slo.yml の rule を強制する
#
# 毎 30 分 cron で走り、各 slot の health を check。
# 期待時刻〜deadline の間で success が無ければ workflow_dispatch で
# auto_post_x.yml を自動 trigger。
#
# これにより GitHub Actions cron の 1-4.5h 遅延に依存せず、
# 「投稿は確実に実行される」を構造的に保証する。
#
# 設計: CLAUDE.md #22 (cron 遅延)・#33 (TypeError) の事故を踏まえた
# 「ユーザーが気づくまで動かない」状態の構造的解消。

on:
  schedule:
    # 30 分おき (重要時間帯のみ走る方が GHA 消費少ないが、シンプル優先)
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  actions: write   # workflow_dispatch trigger に必要
  contents: write  # health.json commit に必要

jobs:
  check-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pyyaml
        run: pip install pyyaml

      - name: 🔍 投稿ヘルスチェック
        id: health
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # missing slots を JSON で取得 (check は未投稿ありで exit 1 を返す)
          # ここは表示用。exit 1 を握らないと set -e で step が死に、後続の自動 trigger step が
          # success() 判定でスキップされ「missing を検知した瞬間に復旧不能になる」自己矛盾が起きる (#36)
          python3 scripts/check_posting_health.py || true
          echo ""
          echo "=== missing slots JSON ==="
          python3 scripts/check_posting_health.py --json-only > /tmp/missing.json || true
          cat /tmp/missing.json
          MISSING_COUNT=$(python3 -c "import json; print(len(json.load(open('/tmp/missing.json'))))")
          echo "missing_count=$MISSING_COUNT" >> "$GITHUB_OUTPUT"
          echo "missing_slots<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/missing.json >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: 🚨 未投稿 slot を自動 trigger
        if: steps.health.outputs.missing_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "📋 ${{ steps.health.outputs.missing_count }} 件の未実行 slot を trigger します"
          echo '${{ steps.health.outputs.missing_slots }}' | python3 -c "
          import json, sys, subprocess, time
          slots = json.load(sys.stdin)
          for s in slots:
              workflow = s.get('workflow', 'auto_post_x.yml')
              mode = s.get('fallback_mode')
              if workflow == 'auto_post_x.yml' and mode:
                  cmd = ['gh', 'workflow', 'run', workflow,
                         '--ref', 'main', '-f', f'mode={mode}']
                  print(f'🔄 Triggering {workflow} mode={mode} ({s[\"slot\"]})...')
              else:
                  cmd = ['gh', 'workflow', 'run', workflow, '--ref', 'main']
                  print(f'🔄 Triggering {workflow} ({s[\"slot\"]})...')
              result = subprocess.run(cmd, capture_output=True, text=True)
              if result.returncode == 0:
                  print(f'  ✅ triggered')
              else:
                  print(f'  ❌ failed: {result.stderr[:200]}')
              time.sleep(3)
          "

      - name: 🔔 missed slot を GitHub Issue で通知 (復旧不能 = 沈黙の失敗を可視化)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          python3 scripts/check_posting_health.py --missed-json > /tmp/missed.json 2>/dev/null || echo "[]" > /tmp/missed.json
          MISSED_COUNT=$(python3 -c "import json; print(len(json.load(open('/tmp/missed.json'))))")
          echo "missed count: $MISSED_COUNT"
          if [ "$MISSED_COUNT" = "0" ]; then
            echo "✅ missed slot なし → Issue 作成不要"
            exit 0
          fi
          # 当日の Issue が既にあれば重複作成しない (title でデデュープ)
          TODAY=$(TZ=Asia/Tokyo date '+%Y-%m-%d')
          TITLE="🚨 投稿/データ SLO 違反 ($TODAY)"
          EXISTING=$(gh issue list --search "$TITLE in:title" --state open --json number --jq 'length' 2>/dev/null || echo "0")
          if [ "$EXISTING" != "0" ]; then
            echo "ℹ️ 当日の SLO Issue は既存 → スキップ"
            exit 0
          fi
          BODY=$(python3 -c "
          import json
          missed = json.load(open('/tmp/missed.json'))
          lines = ['## 復旧不能な未実行 slot (deadline 超過)', '']
          lines.append('| slot | workflow | expected | deadline |')
          lines.append('|---|---|---|---|')
          for m in missed:
              lines.append(f\"| {m['slot']} | {m.get('workflow','?')} | {m.get('expected','?')} | {m.get('deadline','?')} |\")
          lines += ['', '時間ガードを超過したため自動 fallback では復旧できません。',
                    '手動対応が必要なら \`gh workflow run\` で trigger してください。',
                    '', '_この Issue は posting_watchdog.yml が自動生成_']
          print(chr(10).join(lines))
          ")
          gh issue create --title "$TITLE" --body "$BODY" --label "slo-violation" 2>&1 || \
            gh issue create --title "$TITLE" --body "$BODY" 2>&1 || \
            echo "⚠️ Issue 作成失敗 (label 無し再試行も失敗)"
          echo "✅ SLO 違反 Issue 作成 (GitHub からメール通知が飛ぶ)"

      - name: 📝 health.json を commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/posting_health.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no health change to commit"
          else
            git commit -m "watchdog: health update $(TZ=Asia/Tokyo date '+%H:%M JST')"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main || true
              if git push origin HEAD:main; then echo "✅ pushed (try $i)"; break; fi
              echo "⚠️ push retry $i"; sleep 5
            done
          fi

      - name: 📊 Summary
        if: always()
        run: |
          echo "## 🛡 Posting Watchdog Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Missing slots: ${{ steps.health.outputs.missing_count }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat /tmp/missing.json >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "(no data)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
