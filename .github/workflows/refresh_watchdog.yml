name: 🐕 Refresh Watchdog

# refresh_live が GitHub Actions cron 不調で fire しなかった場合に
# 検知して強制 trigger するセーフティネット。
# refresh_live 自体は 15分間隔の cron。watchdog は 5分間隔で監視し、
# 直近成功 run が 18分以上前なら refresh_live を起動する。

on:
  schedule:
    # 土日 JST 9:00-19:55 (UTC 0:00-10:55) 5分間隔
    - cron: '*/5 0-10 * * 6,0'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check refresh_live freshness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 時刻チェック: 土日のレース時間帯のみ動作
          DOW=$(TZ=Asia/Tokyo date +%u)
          HOUR=$(TZ=Asia/Tokyo date +%H)
          if [ "$DOW" -lt 6 ] || [ "$HOUR" -lt 9 ] || [ "$HOUR" -gt 19 ]; then
            echo "⏭️ レース時間外 (DOW=$DOW HOUR=$HOUR)"
            exit 0
          fi

          # refresh_live の直近 run を確認
          RECENT=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=10" \
            --jq '[.workflow_runs[] | select(.name == "🔄 Live Dashboard Refresh") | .created_at] | .[0] // empty')

          if [ -z "$RECENT" ]; then
            echo "📋 refresh_live実行履歴なし → 起動"
            gh workflow run refresh_live.yml -R ${{ github.repository }}
            exit 0
          fi

          RECENT_TS=$(date -d "$RECENT" +%s)
          NOW_TS=$(date +%s)
          DIFF=$(( NOW_TS - RECENT_TS ))
          DIFF_MIN=$(( DIFF / 60 ))
          echo "📊 直近refresh_live: $RECENT (${DIFF_MIN}分前)"

          # 18分以上経過していたら強制起動 (15分cron + 3分マージン)
          if [ "$DIFF" -gt 1080 ]; then
            echo "⚠️ ${DIFF_MIN}分経過 → refresh_live強制起動"
            gh workflow run refresh_live.yml -R ${{ github.repository }}
          else
            echo "✅ 鮮度OK(${DIFF_MIN}分以内) → スキップ"
          fi

      - name: Check collect_results freshness (race day evening only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # collect_results は 17:00/19:00/22:00 の cron。
          # 17時以降に動いていなければ起動する。
          HOUR=$(TZ=Asia/Tokyo date +%H)
          if [ "$HOUR" -lt 17 ] || [ "$HOUR" -gt 23 ]; then
            exit 0
          fi
          DOW=$(TZ=Asia/Tokyo date +%u)
          if [ "$DOW" -lt 6 ]; then
            exit 0
          fi

          RECENT=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=10" \
            --jq '[.workflow_runs[] | select(.name == "📊 Collect Race Results" and .conclusion == "success") | .created_at] | .[0] // empty')

          if [ -z "$RECENT" ]; then
            echo "📋 collect_results実行履歴なし → 起動"
            gh workflow run collect_results.yml -R ${{ github.repository }}
            exit 0
          fi

          RECENT_TS=$(date -d "$RECENT" +%s)
          NOW_TS=$(date +%s)
          DIFF=$(( NOW_TS - RECENT_TS ))
          # 60分以上経過なら起動
          if [ "$DIFF" -gt 3600 ]; then
            echo "⚠️ collect_results が60分以上前 → 強制起動"
            gh workflow run collect_results.yml -R ${{ github.repository }}
          fi
