name: 🧬 Auto Pedigree Backfill

# 出走馬の血統データを自動補完する。
# 既存 fetch_weekend_races.yml で「来週末出走馬」を取得しているが、
# 直近の出走馬や、出走確定後に追加された馬で漏れがあるため、
# 独立 cron で補完ルーチンを走らせる。

on:
  schedule:
    # 木曜 7:00 JST (UTC 水曜 22:00) — 出走馬確定直後
    - cron: '0 22 * * 3'
    # 金曜 7:00 JST (UTC 木曜 22:00) — 出走確定後の追加
    - cron: '0 22 * * 4'
    # 土曜 6:30 JST (UTC 金曜 21:30) — 当日朝の最終
    - cron: '30 21 * * 5'
  workflow_dispatch:
    inputs:
      days:
        description: '何日先までの出走馬を対象にするか'
        required: false
        default: '14'
        type: string
      max_horses:
        description: '1回で補完する最大頭数'
        required: false
        default: '1500'
        type: string

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore keiba.db from cache
        uses: actions/cache@v4
        id: db-cache
        with:
          path: keiba.db
          key: keiba-db-${{ github.run_number }}
          restore-keys: |
            keiba-db-


      # 🛡 git を source of truth に強制 (cache 古さの事故防止 - 2026-05-24)
      - name: Force git DB (override stale cache)
        run: |
          git checkout HEAD -- keiba.db
          echo "✅ keiba.db を git HEAD に復元"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Init DB
        run: python -c "from database import init_db; init_db()"

      - name: Run pedigree backfill
        run: |
          DAYS="${{ github.event.inputs.days || '14' }}"
          MAX="${{ github.event.inputs.max_horses || '1500' }}"
          echo "🧬 days=$DAYS max=$MAX で実行..."
          python3 scripts/auto_pedigree.py --days "$DAYS" --max "$MAX"

      - name: Save DB cache
        uses: actions/cache/save@v4
        with:
          path: keiba.db
          key: keiba-db-${{ github.run_id }}

      - name: Report
        run: |
          python3 -c "
          import sqlite3
          conn = sqlite3.connect('keiba.db')
          c = conn.cursor()
          c.execute(\"SELECT COUNT(*) FROM horses\")
          total = c.fetchone()[0]
          c.execute(\"SELECT COUNT(*) FROM horses WHERE sire IS NULL OR sire=''\")
          missing = c.fetchone()[0]
          print(f'📊 全馬: {total}頭 / 血統未取得: {missing}頭 ({missing/total*100:.0f}%)')
          "
