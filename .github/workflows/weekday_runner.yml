name: 📆 Weekday Slot Runner

# #63 (2026-06-10): GitHub Actions cron の「同時多重不発」対策の本命。
# 6/10 昼に 12:30 cron + 13:10 冗長 cron + */30 watchdog の3系統が同一時間帯に
# 全部不発 → 昼スロット missing (手動復旧) が実測された。同じ GH スケジューラを
# 何重にしても相関故障で同時に死ぬため、土日で実績のある race_day_runner 方式を
# 平日に展開する: 「起動さえできれば、以降は自分の時計で定刻に dispatch する」。
#
# - AM runner: 6:50 起動 → 13:30 まで loop。7:33 に morning / 12:33 に weekday を dispatch
# - PM runner: 19:10 起動 → 21:00 まで loop。20:03 に evening を dispatch
# - dispatch 前に posted_slots (atomic lock) を fresh fetch して確認 = ネイティブ cron が
#   生きていた日は何もしない (+3分の grace でネイティブ優先)
# - 多重 dispatch しても auto_post_x 側の concurrency + atomic lock で冪等
# - GitHub-hosted runner の job 上限 6h に収まる設計 (AM: 6:50→13:30 = 6h40 だが
#   全 slot 処理済みで早期 break するのが通常。上限到達時も watchdog が最終バックストップ)

on:
  schedule:
    # ─ AM 起動 (月-金 JST 6:50 / 7:05 / 7:20 = UTC 前日 21:50 / 22:05 / 22:20) ─
    - cron: '50 21 * * 0-4'
    - cron: '5 22 * * 0-4'
    - cron: '20 22 * * 0-4'
    # ─ PM 起動 (月-金 JST 19:10 / 19:25 / 19:40 = UTC 10:10 / 10:25 / 10:40) ─
    - cron: '10 10 * * 1-5'
    - cron: '25 10 * * 1-5'
    - cron: '40 10 * * 1-5'
  workflow_dispatch:

# 多重起動は直列化 (バックアップ起動は queue → 先発が生きていれば窓外 exit するだけ)
concurrency:
  group: weekday-runner
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355  # GH の 6h 上限の手前で自主終了
    steps:
      - uses: actions/checkout@v4

      - name: Slot dispatch loop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JST() { TZ=Asia/Tokyo date "$@"; }
          DOW=$(JST +%u)
          if [ "$DOW" -gt 5 ]; then
            echo "⏭️ 土日 → race_day_runner の管轄"; exit 0
          fi

          HM=$((10#$(JST +%H) * 100 + 10#$(JST +%M)))
          # 窓の決定: AM(〜13:29) / PM(19:00〜) / それ以外は exit
          if [ "$HM" -lt 1330 ]; then
            WINDOW=AM; END=1330; TARGETS="morning:0733 weekday:1233"
          elif [ "$HM" -ge 1900 ]; then
            WINDOW=PM; END=2100; TARGETS="evening:2003"
          else
            echo "⏭️ 窓外 (13:30-18:59) → exit"; exit 0
          fi
          echo "📆 Weekday Runner [$WINDOW] start $(JST +%H:%M) / end=$END / targets=$TARGETS"

          DISPATCHED=""
          while :; do
            HM=$((10#$(JST +%H) * 100 + 10#$(JST +%M)))
            if [ "$HM" -ge "$END" ]; then echo "🏁 窓終了 ($END)"; break; fi

            for t in $TARGETS; do
              slot=${t%%:*}; due=${t##*:}
              case " $DISPATCHED " in *" $slot "*) continue ;; esac
              if [ "$HM" -ge "$due" ]; then
                # 🔒 fresh な posted_slots を確認 (#61: stale checkout 対策で必ず fetch)
                git fetch -q origin "${GITHUB_REF_NAME:-main}" --depth 1 || true
                git checkout -q "origin/${GITHUB_REF_NAME:-main}" -- keiba.db 2>/dev/null || true
                TODAY=$(JST +%Y-%m-%d)
                LOCK=$(sqlite3 keiba.db \
                  "SELECT run_id FROM posted_slots WHERE post_date='$TODAY' AND slot_name='$slot' LIMIT 1" \
                  2>/dev/null || true)
                if [ -n "$LOCK" ]; then
                  echo "⏭️ [$slot] ネイティブ cron が投稿済み (lock=$LOCK) → skip"
                  DISPATCHED="$DISPATCHED $slot"
                  continue
                fi
                echo "🚀 [$slot] $(JST +%H:%M) — ネイティブ cron 不発と判断 → dispatch"
                if gh workflow run auto_post_x.yml -R "${{ github.repository }}" -f mode="$slot"; then
                  DISPATCHED="$DISPATCHED $slot"
                  echo "  ✅ dispatch 成功"
                else
                  echo "  ⚠️ dispatch 失敗 (次 iter で再試行)"
                fi
              fi
            done

            # 全 target 処理済みなら早期終了
            ALL=1
            for t in $TARGETS; do
              case " $DISPATCHED " in *" ${t%%:*} "*) ;; *) ALL=0 ;; esac
            done
            if [ "$ALL" = 1 ]; then echo "🏁 全 slot 処理済 → 終了"; break; fi

            sleep 120
          done
