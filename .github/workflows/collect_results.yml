name: 📊 Collect Race Results

on:
  schedule:
    # 土日 17:00 JST (UTC 8:00) - レース終了直後
    - cron: '0 8 * * 6,0'
    # 土日 19:00 JST (UTC 10:00) - 確実な結果反映
    - cron: '0 10 * * 6,0'
    # 土日 22:00 JST (UTC 13:00) - 最終確認
    - cron: '0 13 * * 6,0'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore keiba.db from cache
        uses: actions/cache@v4
        id: db-cache
        with:
          path: keiba.db
          key: keiba-db-${{ github.run_number }}
          restore-keys: |
            keiba-db-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Init DB
        run: python -c "from database import init_db; init_db()"

      - name: Determine race date
        id: date
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
          DOW=$(TZ=Asia/Tokyo date +%u)
          # 日曜の深夜(UTC月曜)は土曜の結果も取得
          if [ "$DOW" = "1" ]; then
            YESTERDAY=$(TZ=Asia/Tokyo date -d "yesterday" +%Y%m%d 2>/dev/null || TZ=Asia/Tokyo date -v-1d +%Y%m%d)
            echo "date=$YESTERDAY" >> $GITHUB_OUTPUT
            echo "today=$DATE" >> $GITHUB_OUTPUT
          else
            echo "date=$DATE" >> $GITHUB_OUTPUT
            echo "today=$DATE" >> $GITHUB_OUTPUT
          fi
          echo "📅 対象日: $DATE"

      - name: Collect results
        run: |
          DATE="${{ steps.date.outputs.date }}"
          echo "📥 ${DATE} の結果を収集..."
          python predict.py collect --date "$DATE"
          echo "🔄 race_id同期..."
          python -c "from database import init_db, sync_cache_race_ids; init_db(); sync_cache_race_ids('$DATE')"

      - name: Collect payouts
        run: |
          DATE="${{ steps.date.outputs.date }}"
          echo "💰 ${DATE} の配当を収集..."
          python collect_payouts.py --date "$DATE" || echo "⚠️ 配当収集スキップ"

      - name: Export predictions JSON
        run: |
          DATE="${{ steps.date.outputs.date }}"
          python export_predictions.py "$DATE"

      - name: Save keiba.db to cache
        uses: actions/cache/save@v4
        with:
          path: keiba.db
          key: keiba-db-${{ github.run_number }}

      - name: Deploy to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if git diff --staged --quiet; then
            echo "📋 変更なし"
          else
            git commit -m "📊 Auto collect results $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git push
          fi
