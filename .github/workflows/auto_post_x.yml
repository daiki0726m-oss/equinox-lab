name: 🐦 Auto Post to X
# run-name に mode を入れることで dedup_cron で同モード判定できる
run-name: "${{ github.event.inputs.mode || 'cron' }}"

on:
  # ─── GASからの直接呼び出し（メイン） ───
  workflow_dispatch:
    inputs:
      mode:
        description: '投稿モード'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - weekday
          - predict
          - results
          - answer_check
          - weekly_review
          - refresh_odds
          - refresh_dashboard
          - hit_flash
          - odds_flash
          - post_predict
          - morning
          - evening
          - diagnose
      skip_guard:
        description: '時間ガードをバイパス (緊急手動投稿用、cron遅延等で投稿漏れた時)'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
  # ─── cron フォールバック（GAS不発時のセーフティネット） ───
  schedule:
    # 平日朝7:30 JST (UTC 22:30前日) → 日-木のUTC22:30 = 月-金のJST7:30
    - cron: '30 22 * * 0-4'
    # 土日朝7:00 JST (UTC 22:00前日) → predict
    - cron: '0 22 * * 5,6'
    # 平日昼12:30 JST (UTC 3:30)
    - cron: '30 3 * * 1-5'
    # 平日夜20:00 JST (UTC 11:00)
    - cron: '0 11 * * 1-5'
    # ─── 土日の結果系（GAS不発対策） ───
    # 土日 9:30 JST (UTC 0:30) → odds_flash（内部処理のみ）
    - cron: '30 0 * * 6,0'
    # 土日 10:15 JST (UTC 1:15) → post_predict（確定予想投稿）
    - cron: '15 1 * * 6,0'
    # 土日 15:30 JST (UTC 6:30) → hit_flash
    - cron: '30 6 * * 6,0'
    # 土日 17:30 JST (UTC 8:30) → results
    - cron: '30 8 * * 6,0'
    # 土日 18:30 JST (UTC 9:30) → refresh_dashboard
    - cron: '30 9 * * 6,0'

jobs:
  # ─── 重複投稿防止: cron実行時、直近90分以内にGAS実行があればスキップ ───
  dedup:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: echo "should_run=true" >> $GITHUB_OUTPUT

  dedup_cron:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 cron実行: モード別重複チェック中..."

          # 現在の cron schedule から期待される mode を判定
          SCHEDULE="${{ github.event.schedule }}"
          case "$SCHEDULE" in
            "30 22 * * 0-4")  EXPECTED_MODE="morning" ;;
            "0 22 * * 5,6")   EXPECTED_MODE="predict" ;;
            "30 3 * * 1-5")   EXPECTED_MODE="weekday" ;;
            "0 11 * * 1-5")   EXPECTED_MODE="evening" ;;
            "30 0 * * 6,0")   EXPECTED_MODE="odds_flash" ;;
            "15 1 * * 6,0")   EXPECTED_MODE="post_predict" ;;
            "30 6 * * 6,0")   EXPECTED_MODE="hit_flash" ;;
            "30 8 * * 6,0")   EXPECTED_MODE="results" ;;
            "30 9 * * 6,0")   EXPECTED_MODE="refresh_dashboard" ;;
            *)                EXPECTED_MODE="" ;;
          esac
          echo "📋 期待モード: $EXPECTED_MODE (schedule=$SCHEDULE)"

          if [ -z "$EXPECTED_MODE" ]; then
            echo "⚠️ 未知のschedule → 安全のため実行"
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 直近の workflow_dispatch を期待モードでフィルタ
          # (run-name に mode が入るので display_title で判定可能)
          RECENT=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=20" \
            --jq "[.workflow_runs[] | select(.name == \"🐦 Auto Post to X\" and .conclusion == \"success\" and .event == \"workflow_dispatch\" and .display_title == \"$EXPECTED_MODE\")] | .[0].created_at // empty")

          if [ -n "$RECENT" ]; then
            RECENT_TS=$(date -d "$RECENT" +%s 2>/dev/null || echo 0)
            NOW_TS=$(date +%s)
            DIFF=$(( NOW_TS - RECENT_TS ))
            echo "📊 直近の同モード(${EXPECTED_MODE})実行: $RECENT (${DIFF}秒前)"
            if [ "$DIFF" -lt 5400 ]; then
              echo "⏭️ 同モードが${DIFF}秒前に実行済み → cronスキップ"
              echo "should_run=false" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "✅ 90分以上経過 → cronフォールバック実行"
          else
            echo "✅ 同モードの直近実行なし → cronフォールバック実行"
          fi
          echo "should_run=true" >> $GITHUB_OUTPUT

  post:
    needs: [dedup, dedup_cron]
    if: always() && (needs.dedup.outputs.should_run == 'true' || needs.dedup_cron.outputs.should_run == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── keiba.db をキャッシュから復元 ──
      - name: Restore keiba.db from cache
        uses: actions/cache@v4
        id: db-cache
        with:
          path: keiba.db
          key: keiba-db-${{ github.run_number }}
          restore-keys: |
            keiba-db-

      # ── 🛡 git を source of truth に強制 ──
      # 2026-05-24 オークス予測事故対応: cache が古いと git push 後の DB が反映されず、
      # 朝の正しい予測 (◎スターアニス) が古い予測 (◎エンネ) で上書きされた。
      # cache restore 後に git の DB を強制採用することで、git push 直後でも整合性確保。
      - name: Force git DB (override stale cache)
        run: |
          git checkout HEAD -- keiba.db
          echo "✅ keiba.db を git HEAD に復元 (stale cache を上書き)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install tweepy lightgbm pandas numpy scikit-learn requests beautifulsoup4 lxml

      - name: Check DB status and seed historical data
        run: |
          python -c "from database import init_db; init_db()"
          
          if [ -f keiba.db ]; then
            SIZE=$(du -h keiba.db | cut -f1)
            echo "📂 keiba.db: $SIZE"
          fi
          
          # resultsテーブルのレコード数で過去データの充足度を判定
          RESULT_COUNT=$(python -c "
          from database import get_db
          with get_db() as conn:
              c = conn.execute('SELECT COUNT(*) FROM results WHERE finish_position > 0').fetchone()[0]
              print(c)
          " 2>/dev/null || echo "0")
          
          # タイムあり結果の件数も確認
          TIME_COUNT=$(python -c "
          from database import get_db
          with get_db() as conn:
              print(conn.execute('SELECT COUNT(*) FROM results WHERE finish_time_seconds > 0').fetchone()[0])
          " 2>/dev/null || echo "0")
          
          echo "📊 確定結果レコード: ${RESULT_COUNT}件 / タイムあり: ${TIME_COUNT}件"
          
          # 5000件未満 = 過去データ不足 → 2026年全データ収集
          if [ "$TIME_COUNT" -lt 5000 ]; then
            echo "⚠️ 過去データ不足（タイムあり${TIME_COUNT}件 < 5000件）→ 2026年全月を収集"
            python3 -c "
          from scraper import NetkeibaScraper
          from database import get_db
          import time
          from datetime import datetime
          s = NetkeibaScraper()
          current_month = int('$(TZ=Asia/Tokyo date +%m)')
          for month in range(1, current_month + 1):
              race_ids = s.get_race_list(2026, month)
              for rid in race_ids:
                  with get_db() as conn:
                      ex = conn.execute('SELECT COUNT(*) as c FROM results WHERE race_id=? AND finish_time_seconds>0', (rid,)).fetchone()
                      if ex and ex['c'] > 0: continue
                  try:
                      data = s.scrape_race_result(rid)
                      if data: s.save_race_to_db(data)
                  except: pass
                  time.sleep(1)
          " 2>/dev/null || true
            NEW_COUNT=$(python -c "
            from database import get_db
            with get_db() as conn:
                print(conn.execute('SELECT COUNT(*) FROM results WHERE finish_time_seconds > 0').fetchone()[0])
            " 2>/dev/null || echo "0")
            echo "✅ 過去データ収集完了: タイムあり${NEW_COUNT}件"
          else
            echo "✅ 過去データ充足: タイムあり${TIME_COUNT}件"
          fi

      - name: Determine post type
        id: determine
        run: |
          TODAY_YYYYMMDD=$(TZ=Asia/Tokyo date +%Y%m%d)
          TODAY_HYPHEN=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          DOW=$(TZ=Asia/Tokyo date +%u)  # 1=Mon ... 7=Sun
          HOUR=$(TZ=Asia/Tokyo date +%H)

          MODE="${{ github.event.inputs.mode }}"
          SCHEDULE="${{ github.event.schedule }}"
          echo "📊 Debug: DOW=$DOW, JST_HOUR=$HOUR, MODE=$MODE, SCHEDULE=$SCHEDULE"

          # ── GASからの直接モード指定 ──
          if [ "$MODE" != "" ] && [ "$MODE" != "auto" ]; then
            echo "type=$MODE" >> $GITHUB_OUTPUT
            echo "date=$TODAY_YYYYMMDD" >> $GITHUB_OUTPUT
            echo "date_hyphen=$TODAY_HYPHEN" >> $GITHUB_OUTPUT
            echo "📬 Determined type (direct): $MODE"
            exit 0
          fi

          # ── schedule cron → type マッピング（遅延に影響されない） ──
          # 各cronエントリに対して固定のtypeを返す
          case "$SCHEDULE" in
            "30 22 * * 0-4")  TYPE="morning" ;;         # 平日朝7:30 JST
            "0 22 * * 5,6")   TYPE="predict" ;;         # 土日朝7:00 JST
            "30 3 * * 1-5")   TYPE="weekday" ;;         # 平日昼12:30 JST
            "0 11 * * 1-5")   TYPE="evening" ;;         # 平日夜20:00 JST
            "30 0 * * 6,0")   TYPE="odds_flash" ;;      # 土日 9:30 JST
            "15 1 * * 6,0")   TYPE="post_predict" ;;    # 土日10:15 JST
            "30 6 * * 6,0")   TYPE="hit_flash" ;;       # 土日15:30 JST
            "30 8 * * 6,0")   TYPE="results" ;;         # 土日17:30 JST
            "30 9 * * 6,0")   TYPE="refresh_dashboard" ;; # 土日18:30 JST
            *)
              # schedule値が取れない場合のフォールバック（JST時刻で判定）
              echo "⚠️ Unknown schedule: '$SCHEDULE' → JST時刻フォールバック"
              if [ "$DOW" -ge 1 ] && [ "$DOW" -le 5 ]; then
                # 平日
                case "$HOUR" in
                  06|07|08) TYPE="morning" ;;
                  11|12|13) TYPE="weekday" ;;
                  19|20|21) TYPE="evening" ;;
                  *) TYPE="skip" ;;
                esac
              else
                # 土日
                case "$HOUR" in
                  06|07|08) TYPE="predict" ;;
                  09)       TYPE="odds_flash" ;;
                  10)       TYPE="post_predict" ;;
                  14|15|16) TYPE="hit_flash" ;;
                  17)       TYPE="results" ;;
                  18|19)    TYPE="refresh_dashboard" ;;
                  20)       TYPE="answer_check" ;;
                  21)       TYPE="weekly_review" ;;
                  *) TYPE="skip" ;;
                esac
              fi
              ;;
          esac

          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "📬 Determined type (schedule-mapped): $TYPE"

          echo "date=$TODAY_YYYYMMDD" >> $GITHUB_OUTPUT
          echo "date_hyphen=$TODAY_HYPHEN" >> $GITHUB_OUTPUT

      # 朝の予測（predict/odds_flash のみ）
      - name: Scrape and predict (morning only)
        if: steps.determine.outputs.type == 'predict'
        run: |
          DATE="${{ steps.determine.outputs.date }}"
          DATE_HYPHEN="${{ steps.determine.outputs.date_hyphen }}"
          JST_HOUR=$(TZ=Asia/Tokyo date +%H)

          # 🛡 2026-05-30 fix: fetch_weekend_races が既に出走馬を入れている場合は
          # collect (全レース再 scrape) を skip。これを怠ると weekend predict が
          # scrape 段階で 15分+ stuck し、予測が生成されない事故が起きる (5/30 実例)。
          RUNNERS=$(python -c "
          from database import get_db
          with get_db() as conn:
              n = conn.execute('SELECT COUNT(*) FROM results res JOIN races r ON res.race_id=r.race_id WHERE r.race_date IN (?,?)', ('$DATE_HYPHEN','$DATE')).fetchone()[0]
          print(n)
          " 2>/dev/null || echo 0)
          echo "📊 既存出走馬: ${RUNNERS}頭"

          if [ "$RUNNERS" -ge 50 ]; then
            echo "✅ 出走馬は fetch 済み (${RUNNERS}頭) → collect skip (stuck 防止)"
          else
            echo "📥 ${DATE} のデータをスクレイプ (timeout 300s)..."
            timeout 300 python predict.py collect --date "$DATE" || echo "⚠️ collect timeout/失敗 → 既存データで続行"
          fi

          # 🆕 確定馬番リフレッシュ (#44): 枠順確定前の仮馬番(五十音順)を確定馬番に更新。
          # 怠ると馬番と馬名がズレたまま予測・投稿される。軽量(scrape_shutubaのみ)で stuck しない。
          echo "🏇 確定馬番を更新..."
          timeout 180 python refresh_entries.py --date "$DATE" || echo "⚠️ 確定馬番更新失敗 → 既存データで続行"

          # 10時以降は予測を再実行しない（確定済み予測を保護）
          if [ "$JST_HOUR" -ge 10 ]; then
            echo "🔒 JST ${JST_HOUR}時: 10時以降のため予測をスキップ（確定済み）"
          else
            echo "🧠 予測を実行..."
            python predict.py predict --date "$DATE"
          fi
          echo "🔄 race_id同期..."
          python -c "from database import init_db, sync_cache_race_ids; init_db(); sync_cache_race_ids('$DATE')"

      # 結果収集のみ（10時以降: 予測は再実行しない）
      - name: Collect results (no re-predict)
        if: steps.determine.outputs.type == 'results' || steps.determine.outputs.type == 'answer_check' || steps.determine.outputs.type == 'weekly_review'
        run: |
          DATE="${{ steps.determine.outputs.date }}"
          echo "📥 ${DATE} の結果を収集..."
          python predict.py collect --date "$DATE"
          echo "🔄 race_id同期..."
          python -c "from database import init_db, sync_cache_race_ids; init_db(); sync_cache_race_ids('$DATE')"

      # results/answer_check時に配当も収集
      - name: Collect payouts for results
        if: steps.determine.outputs.type == 'results' || steps.determine.outputs.type == 'answer_check' || steps.determine.outputs.type == 'weekly_review'
        run: |
          DATE="${{ steps.determine.outputs.date }}"
          echo "💰 ${DATE} の配当を収集..."
          python collect_payouts.py --date "$DATE"

      # ダッシュボード自動更新（結果＋オッズ＋配当のみ。予測は変更しない）
      - name: Refresh dashboard (results + odds)
        if: steps.determine.outputs.type == 'refresh_dashboard'
        run: |
          DATE="${{ steps.determine.outputs.date }}"
          echo "📥 ${DATE} の結果を収集..."
          python predict.py collect --date "$DATE"
          echo "🔄 race_id同期..."
          python -c "from database import init_db, sync_cache_race_ids; init_db(); sync_cache_race_ids('$DATE')"
          echo "📡 最新オッズを取得..."
          python refresh_odds.py --date "$DATE"
          echo "💰 配当収集..."
          python collect_payouts.py --date "$DATE"

      # オッズ更新
      - name: Refresh odds before lock
        if: steps.determine.outputs.type == 'odds_flash' || steps.determine.outputs.type == 'predict'
        run: |
          DATE="${{ steps.determine.outputs.date }}"
          JST_HOUR=$(TZ=Asia/Tokyo date +%H)
          # 🆕 確定馬番リフレッシュ (#44): オッズ取得前に馬番を確定版に揃える
          echo "🏇 確定馬番を更新..."
          timeout 180 python refresh_entries.py --date "$DATE" || echo "⚠️ 確定馬番更新失敗 → 続行"
          echo "📡 ${DATE} の最新オッズを取得..."
          python refresh_odds.py --date "$DATE"
          
          # 10時以降は再予測しない（オッズ更新のみ）
          if [ "$JST_HOUR" -ge 10 ]; then
            echo "🔒 JST ${JST_HOUR}時: 10時以降のため再予測をスキップ"
          else
            echo "🧠 オッズ反映後に再予測..."
            python predict.py predict --date "$DATE"
          fi

      # 的中速報用の結果収集
      - name: Collect results for hit_flash
        if: steps.determine.outputs.type == 'hit_flash'
        run: |
          DATE="${{ steps.determine.outputs.date }}"
          echo "📥 ${DATE} の結果を収集..."
          python predict.py collect --date "$DATE"
          python collect_payouts.py --date "$DATE"

      # 平日投稿の前に来週末のレースを事前登録
      - name: Fetch weekend races for weekday posts
        if: contains(fromJSON('["morning","evening","weekday"]'), steps.determine.outputs.type)
        run: |
          echo "📥 来週末のレースを事前登録..."
          python -c "
          from database import init_db; init_db()
          from scraper import NetkeibaScraper
          from datetime import datetime, timedelta, timezone
          import time

          jst = timezone(timedelta(hours=9))
          today = datetime.now(jst)
          dow = today.weekday()
          days_until_sat = (5 - dow) % 7
          if days_until_sat == 0 and dow != 5:
              days_until_sat = 7
          if dow == 5: days_until_sat = 0
          elif dow == 6: days_until_sat = 6

          next_sat = today + timedelta(days=days_until_sat)
          next_sun = next_sat + timedelta(days=1)

          scraper = NetkeibaScraper()
          for d in [next_sat, next_sun]:
              ds = d.strftime('%Y%m%d')
              try:
                  ids = scraper.get_race_list_by_date(ds)
                  r11 = [r for r in ids if r.endswith('11')]
                  print(f'  {ds}: {len(r11)}件の11R')
                  for rid in r11:
                      data = scraper.scrape_shutuba(rid)
                      if data:
                          scraper.save_race_to_db(data)
                          print(f'    ✅ {data[\"race_name\"]}')
                      time.sleep(1)
              except Exception as e:
                  print(f'  ⚠️ {ds}: {e}')
          "

      # 🛡 Pre-flight check: 投稿前にデータ完整性確認 + 自動修復
      # 5/23-24 の事故 (R1-R8 欠落・出走馬未登録・予測キャッシュ空 等) の再発防止
      # races件数 / 出走馬登録率 / 予測キャッシュ件数 を検査し、不足あれば auto-fix
      - name: Pre-flight check (data integrity)
        if: contains(fromJSON('["predict","post_predict","results","hit_flash","odds_flash","answer_check","refresh_dashboard","weekly_review"]'), steps.determine.outputs.type)
        run: |
          DATE="${{ steps.determine.outputs.date }}"
          echo "🛡 Pre-flight check: $DATE"
          # auto-fix モードで実行。致命的問題が残れば exit 2 でこのステップが失敗 → 投稿スキップ
          python3 scripts/preflight_check.py "$DATE" --auto-fix || {
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 2 ]; then
              echo "❌ Pre-flight 致命的問題: 投稿スキップ"
              exit 1
            else
              echo "⚠️ Pre-flight 警告レベル: 投稿続行"
            fi
          }

      - name: Post to X
        if: steps.determine.outputs.type != 'skip'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          # 緊急手動投稿用: skip_guard=1 のときだけ時間ガードをバイパス。
          # それ以外 (cron 含む) は空文字 → post_x.py 側で not '' = True となりガード有効。
          SKIP_PREDICT_GUARD: ${{ github.event.inputs.skip_guard == '1' && '1' || '' }}
        run: |
          TYPE="${{ steps.determine.outputs.type }}"
          DATE="${{ steps.determine.outputs.date }}"

          echo "📬 投稿タイプ: $TYPE / 日付: $DATE"

          if [ "$TYPE" = "weekday" ]; then
            python post_x.py weekday
          elif [ "$TYPE" = "predict" ]; then
            echo "⏳ 7:00予測完了。X投稿は10:15のpost_predict後に実行します"
          elif [ "$TYPE" = "odds_flash" ]; then
            echo "📡 オッズ更新完了。X投稿は10:15のpost_predictで実行します"
          elif [ "$TYPE" = "post_predict" ]; then
            python post_x.py predict --date "$DATE"
          elif [ "$TYPE" = "results" ]; then
            # 投稿対象レース全部が完走するまで自動スキップ (ガードは post_x.py 側)
            python post_x.py results --date "$DATE"
          elif [ "$TYPE" = "answer_check" ]; then
            python post_x.py answer_check --date "$DATE"
          elif [ "$TYPE" = "weekly_review" ]; then
            python post_x.py weekly_review
          elif [ "$TYPE" = "hit_flash" ]; then
            python post_x.py hit_flash --date "$DATE"
          elif [ "$TYPE" = "morning" ]; then
            python post_x.py morning
          elif [ "$TYPE" = "evening" ]; then
            python post_x.py evening
          elif [ "$TYPE" = "diagnose" ]; then
            # X API 診断モード — 書き込みせず、認証/rate limit/token を非破壊チェック
            python3 scripts/x_diagnose.py || echo "(診断スクリプト終了コード ≠ 0)"
          fi

      # ── 静的予測サイト更新（GitHub Pages） ──
      - name: Export predictions to static JSON
        if: contains(fromJSON('["predict","odds_flash","post_predict","hit_flash","refresh_dashboard","results","answer_check","weekly_review"]'), steps.determine.outputs.type)
        run: |
          DATE="${{ steps.determine.outputs.date }}"
          echo "📊 予測データを静的JSONに書き出し..."
          python export_predictions.py "$DATE"

      - name: Deploy to GitHub Pages
        if: contains(fromJSON('["predict","odds_flash","post_predict","hit_flash","refresh_dashboard","results","answer_check","weekly_review"]'), steps.determine.outputs.type)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # docs/data/のJSONのみをデプロイ（predict.htmlはindex.htmlが本体）
          git add docs/data/
          # keiba.dbはcacheで管理するためgitには含めない
          if git diff --staged --quiet; then
            echo "📭 変更なし - デプロイスキップ"
          else
            git commit -m "📊 Update predictions $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            # 並行workflow対策: rebase+retry。compet は -X theirs (リモート優先) で自動解決し
            # unmerged(U) を作業ツリーに残さない。失敗時は rebase --abort で残骸を確実に除去する。
            # (#36: U 残留のまま後続 Save post history が commit を試みて exit 128 で死ぬ事故を防止)
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin "${GITHUB_REF_NAME:-main}" && git push origin "HEAD:${GITHUB_REF_NAME:-main}"; then
                echo "🚀 デプロイ完了 (試行$i)"; break
              fi
              git rebase --abort 2>/dev/null || true
              echo "⚠️ push失敗→リトライ($i)"; sleep 5
            done
          fi

      # ── 投稿履歴を永続化（重複防止用） ──
      - name: Save post history
        if: steps.determine.outputs.type != 'skip'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f docs/data/.post_history.json ]; then
            # Deploy step が if 条件で skip された type でも予測JSONの未コミット変更を一緒に取り込み、
            # U(unmerged) を作らないよう docs/data/ 全体を add する
            git add docs/data/
            if ! git diff --staged --quiet; then
              git commit -m "📝 Update post history $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
              # compet は -X theirs (リモート優先) で自動解決し U を残さない。失敗時は rebase --abort で除去 (#36)
              for i in 1 2 3; do
                if git pull --rebase -X theirs origin "${GITHUB_REF_NAME:-main}" && git push origin "HEAD:${GITHUB_REF_NAME:-main}"; then
                  echo "✅ 投稿履歴を保存 (試行$i)"; break
                fi
                git rebase --abort 2>/dev/null || true
                echo "⚠️ push失敗→リトライ($i)"; sleep 5
              done
            fi
          fi
