name: 🐦 Auto Post to X

on:
  # ─── GASからの直接呼び出し（メイン） ───
  workflow_dispatch:
    inputs:
      mode:
        description: '投稿モード'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - weekday
          - predict
          - results
          - answer_check
          - weekly_review
          - refresh_odds
          - refresh_dashboard
          - hit_flash
          - odds_flash
          - morning
          - evening
  # ─── cron フォールバック（GAS不発時のセーフティネット） ───
  schedule:
    # 平日朝7:30 JST (UTC 22:30前日)
    - cron: '30 22 * * 0-4'
    # 土日朝7:00 JST (UTC 22:00前日) → predict
    - cron: '0 22 * * 5,6'
    # 平日昼12:30 JST (UTC 3:30)
    - cron: '30 3 * * 1-5'
    # 平日夜20:00 JST (UTC 11:00)
    - cron: '0 11 * * 1-5'
    # ─── 土日の結果系（GAS不発対策） ───
    # 土日 9:30 JST (UTC 0:30) → odds_flash
    - cron: '30 0 * * 6,0'
    # 土日 15:30 JST (UTC 6:30) → hit_flash
    - cron: '30 6 * * 6,0'
    # 土日 17:30 JST (UTC 8:30) → results
    - cron: '30 8 * * 6,0'
    # 土日 18:30 JST (UTC 9:30) → refresh_dashboard
    - cron: '30 9 * * 6,0'

jobs:
  # ─── 重複投稿防止: cron実行時、直近90分以内にGAS実行があればスキップ ───
  dedup:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: echo "should_run=true" >> $GITHUB_OUTPUT

  dedup_cron:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 cron実行: 重複チェック中..."
          RECENT=$(gh api repos/${{ github.repository }}/actions/runs?per_page=5 \
            --jq '[.workflow_runs[] | select(.name == "🐦 Auto Post to X" and .conclusion == "success" and .event == "workflow_dispatch")] | .[0].created_at // empty')
          
          if [ -n "$RECENT" ]; then
            RECENT_TS=$(date -d "$RECENT" +%s 2>/dev/null || echo 0)
            NOW_TS=$(date +%s)
            DIFF=$(( NOW_TS - RECENT_TS ))
            echo "📊 直近GAS実行: $RECENT (${DIFF}秒前)"
            if [ "$DIFF" -lt 5400 ]; then
              echo "⏭️ GASが${DIFF}秒前に実行済み → cronスキップ"
              echo "should_run=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "✅ GAS未実行 → cronフォールバック実行"
          echo "should_run=true" >> $GITHUB_OUTPUT

  post:
    needs: [dedup, dedup_cron]
    if: always() && (needs.dedup.outputs.should_run == 'true' || needs.dedup_cron.outputs.should_run == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install tweepy lightgbm pandas numpy scikit-learn requests beautifulsoup4 lxml

      - name: Determine post type
        id: determine
        run: |
          DOW=$(TZ=Asia/Tokyo date +%u)  # 1=Mon ... 7=Sun
          HOUR=$(TZ=Asia/Tokyo date +%H)
          TODAY_YYYYMMDD=$(TZ=Asia/Tokyo date +%Y%m%d)
          TODAY_HYPHEN=$(TZ=Asia/Tokyo date +%Y-%m-%d)

          MODE="${{ github.event.inputs.mode }}"
          echo "📊 Debug: DOW=$DOW, JST_HOUR=$HOUR, MODE=$MODE"

          # GASから直接モード指定がある場合はそのまま使用
          if [ "$MODE" != "" ] && [ "$MODE" != "auto" ]; then
            echo "type=$MODE" >> $GITHUB_OUTPUT
            echo "date=$TODAY_YYYYMMDD" >> $GITHUB_OUTPUT
            echo "date_hyphen=$TODAY_HYPHEN" >> $GITHUB_OUTPUT
            echo "📬 Determined type (direct): $MODE"
            exit 0
          fi

          # autoモード: JST時間で柔軟に判定（分単位チェック廃止）
          if [ "$HOUR" = "07" ] || [ "$HOUR" = "06" ]; then
            if [ "$DOW" -eq 6 ] || [ "$DOW" -eq 7 ]; then
              TYPE="predict"
            else
              TYPE="morning"
            fi
          elif [ "$HOUR" = "09" ] || [ "$HOUR" = "10" ]; then
            if [ "$DOW" -eq 6 ] || [ "$DOW" -eq 7 ]; then
              TYPE="odds_flash"
            else
              TYPE="skip"
            fi
          elif [ "$HOUR" = "12" ]; then
            if [ "$DOW" -ge 1 ] && [ "$DOW" -le 5 ]; then
              TYPE="weekday"
            else
              TYPE="skip"
            fi
          elif [ "$HOUR" = "15" ] || [ "$HOUR" = "16" ]; then
            if [ "$DOW" -eq 6 ] || [ "$DOW" -eq 7 ]; then
              TYPE="hit_flash"
            else
              TYPE="skip"
            fi
          elif [ "$HOUR" = "17" ]; then
            if [ "$DOW" -eq 6 ] || [ "$DOW" -eq 7 ]; then
              TYPE="results"
            else
              TYPE="skip"
            fi
          elif [ "$HOUR" = "18" ] || [ "$HOUR" = "19" ]; then
            if [ "$DOW" -eq 6 ] || [ "$DOW" -eq 7 ]; then
              TYPE="refresh_dashboard"
            else
              TYPE="skip"
            fi
          elif [ "$HOUR" = "20" ] || [ "$HOUR" = "21" ]; then
            if [ "$DOW" -eq 6 ]; then
              TYPE="answer_check"
            elif [ "$DOW" -eq 7 ]; then
              TYPE="weekly_review"
            elif [ "$DOW" -ge 1 ] && [ "$DOW" -le 5 ]; then
              TYPE="evening"
            else
              TYPE="skip"
            fi
          else
            TYPE="skip"
          fi

          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "📬 Determined type (auto): $TYPE"

          echo "date=$TODAY_YYYYMMDD" >> $GITHUB_OUTPUT
          echo "date_hyphen=$TODAY_HYPHEN" >> $GITHUB_OUTPUT

      # 朝の予測（predict/odds_flash のみ）
      - name: Scrape and predict (morning only)
        if: steps.determine.outputs.type == 'predict'
        run: |
          DATE="${{ steps.determine.outputs.date }}"
          echo "📥 ${DATE} のデータをスクレイプ..."
          python predict.py collect --date "$DATE" || echo "⚠️ スクレイプ完了（一部エラーあり）"
          echo "🧠 予測を実行..."
          python predict.py predict --date "$DATE" || echo "⚠️ 予測完了（一部エラーあり）"

      # 結果収集のみ（10時以降: 予測は再実行しない）
      - name: Collect results (no re-predict)
        if: steps.determine.outputs.type == 'results' || steps.determine.outputs.type == 'answer_check' || steps.determine.outputs.type == 'weekly_review' || steps.determine.outputs.type == 'hit_flash'
        run: |
          DATE="${{ steps.determine.outputs.date }}"
          echo "📥 ${DATE} の結果を収集..."
          python predict.py collect --date "$DATE" || echo "⚠️ 結果収集完了（一部エラーあり）"

      # results/answer_check時に配当も収集
      - name: Collect payouts for results
        if: steps.determine.outputs.type == 'results' || steps.determine.outputs.type == 'answer_check' || steps.determine.outputs.type == 'weekly_review'
        run: |
          DATE="${{ steps.determine.outputs.date }}"
          echo "💰 ${DATE} の配当を収集..."
          python collect_payouts.py --date "$DATE" || echo "⚠️ 配当収集完了（一部エラーあり）"

      # ダッシュボード自動更新（結果＋オッズ＋配当。予測は朝の1回で固定）
      - name: Refresh dashboard (results + odds)
        if: steps.determine.outputs.type == 'refresh_dashboard'
        run: |
          DATE="${{ steps.determine.outputs.date }}"
          echo "📥 ${DATE} の結果を収集..."
          python predict.py collect --date "$DATE" || echo "⚠️ 結果収集完了（一部エラーあり）"
          echo "📡 最新オッズを取得..."
          python refresh_odds.py --date "$DATE" || echo "⚠️ オッズ更新完了（一部エラーあり）"
          echo "💰 配当収集..."
          python collect_payouts.py --date "$DATE" || echo "⚠️ 配当収集完了（一部エラーあり）"

      # オッズ更新
      - name: Refresh odds before lock
        if: steps.determine.outputs.type == 'odds_flash' || steps.determine.outputs.type == 'predict'
        run: |
          DATE="${{ steps.determine.outputs.date }}"
          echo "📡 ${DATE} の最新オッズを取得..."
          python refresh_odds.py --date "$DATE" || echo "⚠️ オッズ更新完了（一部エラーあり）"
          echo "🧠 オッズ反映後に再予測..."
          python predict.py predict --date "$DATE" || echo "⚠️ 再予測完了（一部エラーあり）"

      # 的中速報用の結果収集
      - name: Collect results for hit_flash
        if: steps.determine.outputs.type == 'hit_flash'
        run: |
          DATE="${{ steps.determine.outputs.date }}"
          echo "📥 ${DATE} の結果を収集..."
          python predict.py collect --date "$DATE" || echo "⚠️ 結果収集完了（一部エラーあり）"
          python collect_payouts.py --date "$DATE" || echo "⚠️ 配当収集完了（一部エラーあり）"

      - name: Post to X
        if: steps.determine.outputs.type != 'skip'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          TYPE="${{ steps.determine.outputs.type }}"
          DATE="${{ steps.determine.outputs.date }}"

          echo "📬 投稿タイプ: $TYPE / 日付: $DATE"

          if [ "$TYPE" = "weekday" ]; then
            python post_x.py weekday
          elif [ "$TYPE" = "predict" ]; then
            python post_x.py predict --date "$DATE"
          elif [ "$TYPE" = "results" ]; then
            python post_x.py results --date "$DATE"
          elif [ "$TYPE" = "answer_check" ]; then
            python post_x.py answer_check --date "$DATE"
          elif [ "$TYPE" = "weekly_review" ]; then
            python post_x.py weekly_review
          elif [ "$TYPE" = "hit_flash" ]; then
            python post_x.py hit_flash --date "$DATE"
          elif [ "$TYPE" = "odds_flash" ]; then
            python post_x.py odds_flash --date "$DATE"
          elif [ "$TYPE" = "morning" ]; then
            python post_x.py morning
          elif [ "$TYPE" = "evening" ]; then
            python post_x.py evening
          fi

      # ── 静的予測サイト更新（GitHub Pages） ──
      - name: Export predictions to static JSON
        if: contains(fromJSON('["predict","odds_flash","hit_flash","refresh_dashboard","results","answer_check"]'), steps.determine.outputs.type)
        run: |
          DATE="${{ steps.determine.outputs.date }}"
          echo "📊 予測データを静的JSONに書き出し..."
          python export_predictions.py "$DATE"

      - name: Deploy to GitHub Pages
        if: contains(fromJSON('["predict","odds_flash","hit_flash","refresh_dashboard","results","answer_check"]'), steps.determine.outputs.type)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          # 結果反映モードではkeiba.dbもコミット（結果・配当データの永続化）
          TYPE="${{ steps.determine.outputs.type }}"
          if [ "$TYPE" = "results" ] || [ "$TYPE" = "answer_check" ] || [ "$TYPE" = "refresh_dashboard" ] || [ "$TYPE" = "hit_flash" ]; then
            git add keiba.db || true
          fi
          if git diff --staged --quiet; then
            echo "📭 変更なし - デプロイスキップ"
          else
            git commit -m "📊 Update predictions $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git push
            echo "🚀 GitHub Pages に予測データをデプロイ完了"
          fi

      # ── 投稿履歴を永続化（重複防止用） ──
      - name: Save post history
        if: steps.determine.outputs.type != 'skip'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f docs/data/.post_history.json ]; then
            git add docs/data/.post_history.json
            if ! git diff --staged --quiet; then
              git commit -m "📝 Update post history $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
              git push
              echo "✅ 投稿履歴を保存"
            fi
          fi
