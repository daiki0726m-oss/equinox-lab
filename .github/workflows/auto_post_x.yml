name: 🐦 Auto Post to X

on:
  # ─── スケジュールはGoogle Apps Script経由で workflow_dispatch を使用 ───
  # cron は重複投稿の原因になるため無効化（2026-04-02）
  workflow_dispatch:
    inputs:
      mode:
        description: '投稿モード'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - weekday
          - predict
          - results
          - answer_check
          - weekly_review
          - refresh_odds
          - refresh_dashboard
          - hit_flash
          - odds_flash
          - morning
          - evening

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install tweepy lightgbm pandas numpy scikit-learn requests beautifulsoup4 lxml

      - name: Determine post type
        id: determine
        run: |
          DOW=$(TZ=Asia/Tokyo date +%u)  # 1=Mon ... 7=Sun
          HOUR=$(TZ=Asia/Tokyo date +%H)
          TODAY_YYYYMMDD=$(TZ=Asia/Tokyo date +%Y%m%d)
          TODAY_HYPHEN=$(TZ=Asia/Tokyo date +%Y-%m-%d)

          MODE="${{ github.event.inputs.mode }}"
          echo "📊 Debug: DOW=$DOW, JST_HOUR=$HOUR, MODE=$MODE"

          # GASから直接モード指定がある場合はそのまま使用
          if [ "$MODE" != "" ] && [ "$MODE" != "auto" ]; then
            echo "type=$MODE" >> $GITHUB_OUTPUT
            echo "date=$TODAY_YYYYMMDD" >> $GITHUB_OUTPUT
            echo "date_hyphen=$TODAY_HYPHEN" >> $GITHUB_OUTPUT
            echo "📬 Determined type (direct): $MODE"
            exit 0
          fi

          # autoモード: JST時間で柔軟に判定（分単位チェック廃止）
          if [ "$HOUR" = "07" ] || [ "$HOUR" = "06" ]; then
            if [ "$DOW" -eq 6 ] || [ "$DOW" -eq 7 ]; then
              TYPE="predict"
            else
              TYPE="morning"
            fi
          elif [ "$HOUR" = "09" ] || [ "$HOUR" = "10" ]; then
            if [ "$DOW" -eq 6 ] || [ "$DOW" -eq 7 ]; then
              TYPE="odds_flash"
            else
              TYPE="skip"
            fi
          elif [ "$HOUR" = "12" ]; then
            if [ "$DOW" -ge 1 ] && [ "$DOW" -le 5 ]; then
              TYPE="weekday"
            else
              TYPE="skip"
            fi
          elif [ "$HOUR" = "15" ] || [ "$HOUR" = "16" ]; then
            if [ "$DOW" -eq 6 ] || [ "$DOW" -eq 7 ]; then
              TYPE="hit_flash"
            else
              TYPE="skip"
            fi
          elif [ "$HOUR" = "17" ]; then
            if [ "$DOW" -eq 6 ] || [ "$DOW" -eq 7 ]; then
              TYPE="results"
            else
              TYPE="skip"
            fi
          elif [ "$HOUR" = "20" ] || [ "$HOUR" = "21" ]; then
            if [ "$DOW" -eq 6 ]; then
              TYPE="answer_check"
            elif [ "$DOW" -eq 7 ]; then
              TYPE="weekly_review"
            elif [ "$DOW" -ge 1 ] && [ "$DOW" -le 5 ]; then
              TYPE="evening"
            else
              TYPE="skip"
            fi
          else
            TYPE="skip"
          fi

          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "📬 Determined type (auto): $TYPE"

          echo "date=$TODAY_YYYYMMDD" >> $GITHUB_OUTPUT
          echo "date_hyphen=$TODAY_HYPHEN" >> $GITHUB_OUTPUT

      # 土日はスクレイプ→予測が必要
      - name: Scrape and predict (weekend only)
        if: steps.determine.outputs.type == 'predict' || steps.determine.outputs.type == 'results' || steps.determine.outputs.type == 'answer_check' || steps.determine.outputs.type == 'weekly_review' || steps.determine.outputs.type == 'hit_flash'
        run: |
          DATE="${{ steps.determine.outputs.date }}"
          echo "📥 ${DATE} のデータをスクレイプ..."
          python predict.py collect --date "$DATE" || echo "⚠️ スクレイプ完了（一部エラーあり）"
          echo "🧠 予測を実行..."
          python predict.py predict --date "$DATE" || echo "⚠️ 予測完了（一部エラーあり）"

      # ダッシュボード自動更新（結果＋オッズ＋配当。予測は朝の1回で固定）
      - name: Refresh dashboard (results + odds)
        if: steps.determine.outputs.type == 'refresh_dashboard'
        run: |
          DATE="${{ steps.determine.outputs.date }}"
          echo "📥 ${DATE} の結果を収集..."
          python predict.py collect --date "$DATE" || echo "⚠️ 結果収集完了（一部エラーあり）"
          echo "📡 最新オッズを取得..."
          python refresh_odds.py --date "$DATE" || echo "⚠️ オッズ更新完了（一部エラーあり）"
          echo "💰 配当収集..."
          python collect_payouts.py --date "$DATE" || echo "⚠️ 配当収集完了（一部エラーあり）"

      # オッズ更新
      - name: Refresh odds before lock
        if: steps.determine.outputs.type == 'odds_flash' || steps.determine.outputs.type == 'predict'
        run: |
          DATE="${{ steps.determine.outputs.date }}"
          echo "📡 ${DATE} の最新オッズを取得..."
          python refresh_odds.py --date "$DATE" || echo "⚠️ オッズ更新完了（一部エラーあり）"
          echo "🧠 オッズ反映後に再予測..."
          python predict.py predict --date "$DATE" || echo "⚠️ 再予測完了（一部エラーあり）"

      # 的中速報用の結果収集
      - name: Collect results for hit_flash
        if: steps.determine.outputs.type == 'hit_flash'
        run: |
          DATE="${{ steps.determine.outputs.date }}"
          echo "📥 ${DATE} の結果を収集..."
          python predict.py collect --date "$DATE" || echo "⚠️ 結果収集完了（一部エラーあり）"
          python collect_payouts.py --date "$DATE" || echo "⚠️ 配当収集完了（一部エラーあり）"

      - name: Post to X
        if: steps.determine.outputs.type != 'skip'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          TYPE="${{ steps.determine.outputs.type }}"
          DATE="${{ steps.determine.outputs.date }}"

          echo "📬 投稿タイプ: $TYPE / 日付: $DATE"

          if [ "$TYPE" = "weekday" ]; then
            python post_x.py weekday
          elif [ "$TYPE" = "predict" ]; then
            python post_x.py predict --date "$DATE"
          elif [ "$TYPE" = "results" ]; then
            python post_x.py results --date "$DATE"
          elif [ "$TYPE" = "answer_check" ]; then
            python post_x.py answer_check --date "$DATE"
          elif [ "$TYPE" = "weekly_review" ]; then
            python post_x.py weekly_review
          elif [ "$TYPE" = "hit_flash" ]; then
            python post_x.py hit_flash --date "$DATE"
          elif [ "$TYPE" = "odds_flash" ]; then
            python post_x.py odds_flash --date "$DATE"
          elif [ "$TYPE" = "morning" ]; then
            python post_x.py morning
          elif [ "$TYPE" = "evening" ]; then
            python post_x.py evening
          fi

      # ── 静的予測サイト更新（GitHub Pages） ──
      - name: Export predictions to static JSON
        if: contains(fromJSON('["predict","odds_flash","hit_flash","refresh_dashboard","results","answer_check"]'), steps.determine.outputs.type)
        run: |
          DATE="${{ steps.determine.outputs.date }}"
          echo "📊 予測データを静的JSONに書き出し..."
          python export_predictions.py "$DATE"

      - name: Deploy to GitHub Pages
        if: contains(fromJSON('["predict","odds_flash","hit_flash","refresh_dashboard","results","answer_check"]'), steps.determine.outputs.type)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if git diff --staged --quiet; then
            echo "📭 変更なし - デプロイスキップ"
          else
            git commit -m "📊 Update predictions $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git push
            echo "🚀 GitHub Pages に予測データをデプロイ完了"
          fi

      # ── 投稿履歴を永続化（重複防止用） ──
      - name: Save post history
        if: steps.determine.outputs.type != 'skip'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f docs/data/.post_history.json ]; then
            git add docs/data/.post_history.json
            if ! git diff --staged --quiet; then
              git commit -m "📝 Update post history $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
              git push
              echo "✅ 投稿履歴を保存"
            fi
          fi
