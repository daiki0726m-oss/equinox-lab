name: 🔄 Live Dashboard Refresh

on:
  schedule:
    # 土日朝 8-9時に複数回 cron 設定 → 1回でもfireすればchain開始
    # その後はworkflow末尾で自己トリガーするので cron 不発でも継続する
    - cron: '0 23 * * 5,6'        # JST 8:00 (UTC 23:00 前日)
    - cron: '30 23 * * 5,6'       # JST 8:30
    - cron: '0 0 * * 6,0'         # JST 9:00
    # 念のため cron も 15分おき(自己トリガーが死んだ時のbackup)
    - cron: '0,15,30,45 0-10 * * 6,0'
  workflow_dispatch:
    inputs:
      force_predict:
        description: '再予測も実行する'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      no_chain:
        description: '自己永続化を無効にする(単発実行)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  actions: write

concurrency:
  group: live-refresh
  # 重要: false にして 自己トリガーした次runを cancel しない
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore keiba.db from cache
        uses: actions/cache@v4
        with:
          path: keiba.db
          key: keiba-db-${{ github.run_number }}
          restore-keys: |
            keiba-db-

      # 🛡 git を source of truth に強制 (cache 古さの事故防止 - 2026-05-24)
      - name: Force git DB (override stale cache)
        run: |
          git checkout HEAD -- keiba.db
          echo "✅ keiba.db を git HEAD に復元"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install tweepy lightgbm pandas numpy scikit-learn requests beautifulsoup4 lxml

      - name: Check if race day
        id: check
        run: |
          DOW=$(TZ=Asia/Tokyo date +%u)
          HOUR=$(TZ=Asia/Tokyo date +%H)
          echo "dow=$DOW hour=$HOUR"
          
          # 土日(6,7)のレース時間帯(9-19時)のみ実行
          if [ "$DOW" -eq 6 ] || [ "$DOW" -eq 7 ]; then
            if [ "$HOUR" -ge 9 ] && [ "$HOUR" -le 19 ]; then
              echo "should_run=true" >> $GITHUB_OUTPUT
            else
              echo "⏭️ レース時間外 (${HOUR}時)"
              echo "should_run=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "⏭️ 平日のためスキップ"
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Init DB
        if: steps.check.outputs.should_run == 'true'
        run: |
          python -c "from database import init_db; init_db()"

      - name: Collect latest results + odds
        if: steps.check.outputs.should_run == 'true'
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
          echo "📥 ${DATE} の最新データを取得..."
          python predict.py collect --date "$DATE"
          echo "📡 最新オッズを取得..."
          python refresh_odds.py --date "$DATE"
          echo "💰 配当を収集..."
          python collect_payouts.py --date "$DATE" || echo "⚠️ 配当なし（レース未確定）"
          echo "🔄 race_id同期..."
          python -c "from database import init_db, sync_cache_race_ids; init_db(); sync_cache_race_ids('$DATE')"

      - name: Re-predict if requested
        if: steps.check.outputs.should_run == 'true' && github.event.inputs.force_predict == 'true'
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
          echo "🧠 再予測実行..."
          python predict.py predict --date "$DATE" --force

      # 🛡 Pre-flight: 当日データ完整性を確認、不足あれば auto-fix
      - name: Pre-flight check (data integrity)
        if: steps.check.outputs.should_run == 'true'
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
          echo "🛡 Pre-flight check: $DATE"
          python3 scripts/preflight_check.py "$DATE" --auto-fix --quiet || echo "⚠️ Pre-flight 警告(続行)"

      - name: Export predictions to static JSON
        if: steps.check.outputs.should_run == 'true'
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
          echo "📊 予測データを静的JSONに書き出し..."
          python export_predictions.py "$DATE"

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/data/
          if git diff --cached --quiet; then
            echo "📭 データ変更なし"
          else
            git commit -m "🔄 Live update: $(TZ=Asia/Tokyo date '+%H:%M') JST"
            # 競合を回避するリトライ付きpush(--autostash で keiba.db 等の未staged変更を自動退避)
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" && git push && break
              echo "⚠️ push失敗 (${i}/3) - 再試行..."
              sleep 5
            done
          fi

      - name: Save keiba.db to cache
        if: steps.check.outputs.should_run == 'true'
        uses: actions/cache/save@v4
        with:
          path: keiba.db
          key: keiba-db-${{ github.run_number }}

      # ── 永続化: keiba.db を repo にも commit ──
      # cache@v4 は eviction / race condition で消える可能性があるので、
      # git にも push して durable な source of truth を維持する。
      - name: Commit keiba.db to repo (durable persistence)
        if: steps.check.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f keiba.db 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "📭 keiba.db 変更なし"
          else
            git commit -m "📊 refresh_live: keiba.db update $(TZ=Asia/Tokyo date '+%H:%M') JST"
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
              if git push origin "HEAD:${GITHUB_REF_NAME:-main}"; then echo "🚀 DB committed (try $i)"; break; fi
              echo "⚠️ push失敗→retry($i)"; sleep 5
            done
          fi

      # ── 自己永続化 chain: 10分後に自分自身をdispatch ──
      # 旧cron依存を脱して、1回起動すれば 19時まで自動継続させる仕組み。
      # public repo は Actions時間無制限なので長時間 sleep してOK。
      - name: Self-trigger next iteration
        if: always() && github.event.inputs.no_chain != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DOW=$(TZ=Asia/Tokyo date +%u)
          HOUR=$(TZ=Asia/Tokyo date +%H)
          # 終了条件: 19時以降 or 平日
          if [ "$HOUR" -ge 19 ]; then
            echo "🏁 19時到達 → chain終了"
            exit 0
          fi
          if [ "$DOW" -lt 6 ]; then
            echo "🏁 平日 → chain終了"
            exit 0
          fi
          # 9時前なら chain 早期起動を待つ
          if [ "$HOUR" -lt 9 ]; then
            echo "⏳ 9時前 → chain開始は9時から(15分後にretrigger)"
            sleep 900
          else
            echo "💤 10分sleep して次のrunをdispatch"
            sleep 600
          fi
          gh workflow run refresh_live.yml -R ${{ github.repository }} \
            && echo "🔁 next refresh_live dispatched" \
            || echo "⚠️ self-trigger失敗(watchdogが補完するはず)"
