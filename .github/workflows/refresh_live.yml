name: 🔄 Live Dashboard Refresh

on:
  schedule:
    # 土日のレース時間帯に15分おきに実行 (UTC → JST +9時間)
    # JST 10:00-16:45 → UTC 1:00-7:45
    # 毎時 0分, 15分, 30分, 45分
    - cron: '0,15,30,45 1-7 * * 6,0'
  workflow_dispatch:
    inputs:
      force_predict:
        description: '再予測も実行する'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: live-refresh
  cancel-in-progress: true  # 前回がまだ動いていたらキャンセル

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore keiba.db from cache
        uses: actions/cache@v4
        with:
          path: keiba.db
          key: keiba-db-${{ github.run_number }}
          restore-keys: |
            keiba-db-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install tweepy lightgbm pandas numpy scikit-learn requests beautifulsoup4 lxml

      - name: Check if race day
        id: check
        run: |
          DOW=$(TZ=Asia/Tokyo date +%u)
          HOUR=$(TZ=Asia/Tokyo date +%H)
          echo "dow=$DOW hour=$HOUR"
          
          # 土日(6,7)のレース時間帯(10-17時)のみ実行
          if [ "$DOW" -eq 6 ] || [ "$DOW" -eq 7 ]; then
            if [ "$HOUR" -ge 10 ] && [ "$HOUR" -le 17 ]; then
              echo "should_run=true" >> $GITHUB_OUTPUT
            else
              echo "⏭️ レース時間外 (${HOUR}時)"
              echo "should_run=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "⏭️ 平日のためスキップ"
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Init DB
        if: steps.check.outputs.should_run == 'true'
        run: |
          python -c "from database import init_db; init_db()"

      - name: Collect latest results + odds
        if: steps.check.outputs.should_run == 'true'
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
          echo "📥 ${DATE} の最新データを取得..."
          python predict.py collect --date "$DATE"
          echo "📡 最新オッズを取得..."
          python refresh_odds.py --date "$DATE"
          echo "💰 配当を収集..."
          python collect_payouts.py --date "$DATE" || echo "⚠️ 配当なし（レース未確定）"
          echo "🔄 race_id同期..."
          python -c "from database import init_db, sync_cache_race_ids; init_db(); sync_cache_race_ids('$DATE')"

      - name: Re-predict if requested
        if: steps.check.outputs.should_run == 'true' && github.event.inputs.force_predict == 'true'
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
          echo "🧠 再予測実行..."
          python predict.py predict --date "$DATE" --force

      - name: Export predictions to static JSON
        if: steps.check.outputs.should_run == 'true'
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
          echo "📊 予測データを静的JSONに書き出し..."
          python export_predictions.py --date "$DATE"

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/data/
          if git diff --cached --quiet; then
            echo "📭 データ変更なし"
          else
            git commit -m "🔄 Live update: $(TZ=Asia/Tokyo date '+%H:%M') JST"
            # 競合を回避するリトライ付きpush
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "⚠️ push失敗 (${i}/3) - 再試行..."
              sleep 5
            done
          fi

      - name: Save keiba.db to cache
        if: steps.check.outputs.should_run == 'true'
        uses: actions/cache/save@v4
        with:
          path: keiba.db
          key: keiba-db-${{ github.run_number }}
