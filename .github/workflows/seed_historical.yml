name: 📦 Seed Historical Data

on:
  # 毎週月曜 JST 03:00 (UTC 18:00 日曜) に実行 → 先週末の結果を蓄積
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      year:
        description: '収集する年 (例: 2021)'
        required: false
        default: ''
      months:
        description: '収集する月(カンマ区切り、例: 1,2,3,4)'
        required: false
        default: ''

concurrency:
  group: keiba-db-accum          # #70 part1: 蓄積系writerを直列化しgz clobberを防ぐ
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # 1年分(~3500R × 1秒) = 60分目安、余裕みて 350分
    steps:
      - uses: actions/checkout@v4

      - name: Restore keiba.db from cache
        uses: actions/cache@v4
        with:
          path: keiba.db
          key: keiba-db-${{ github.run_number }}
          restore-keys: |
            keiba-db-


      # 🛡 git を source of truth に強制 (cache 古さの事故防止 - 2026-05-24)
      - name: Force git DB (override stale cache)
        run: |
          git checkout HEAD -- keiba.db.gz
          bash scripts/db_unpack.sh
          echo "✅ keiba.db を git HEAD に復元"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialize DB
        run: python -c "from database import init_db; init_db()"

      - name: Collect historical data
        env:
          INPUT_YEAR: ${{ github.event.inputs.year }}
          INPUT_MONTHS: ${{ github.event.inputs.months }}
        run: |
          python3 << 'PYEOF'
          from scraper import NetkeibaScraper
          from database import get_db
          import time, os, sys

          s = NetkeibaScraper()

          # 収集対象年を決定 (省略時は今年)
          input_year = os.environ.get("INPUT_YEAR", "").strip()
          if input_year:
              year = int(input_year)
          else:
              from datetime import datetime
              year = datetime.now().year

          # 収集対象月を決定
          input_months = os.environ.get("INPUT_MONTHS", "").strip()
          if input_months:
              months = [int(m.strip()) for m in input_months.split(",") if m.strip()]
          else:
              # 過去年: 1-12月全部 / 今年: 1月〜現在月
              from datetime import datetime
              if year < datetime.now().year:
                  months = list(range(1, 13))
              else:
                  months = list(range(1, datetime.now().month + 1))

          print(f"📅 収集対象: {year}年 {months} 月")

          for month in months:
              print(f"\n{'='*50}")
              print(f"🏇 {year}年{month}月 収集開始")
              print(f"{'='*50}")

              race_ids = s.get_race_list(year, month)
              collected = 0
              skipped = 0

              for i, race_id in enumerate(race_ids):
                  # 既にDB にタイムあり結果があればスキップ
                  with get_db() as conn:
                      existing = conn.execute(
                          "SELECT COUNT(*) as c FROM results WHERE race_id = ? AND finish_time_seconds > 0",
                          (race_id,)
                      ).fetchone()
                      if existing and existing['c'] > 0:
                          skipped += 1
                          continue

                  try:
                      race_data = s.scrape_race_result(race_id)
                      if race_data:
                          s.save_race_to_db(race_data)
                          collected += 1
                  except Exception as e:
                      print(f"  ⚠️ {race_id}: {e}")

                  time.sleep(1)  # レート制限

              print(f"📊 {month}月: 新規{collected}件 / スキップ{skipped}件")

          # 最終集計
          with get_db() as conn:
              total_races = conn.execute("SELECT COUNT(*) as c FROM races").fetchone()['c']
              total_results = conn.execute("SELECT COUNT(*) as c FROM results").fetchone()['c']
              with_time = conn.execute("SELECT COUNT(*) as c FROM results WHERE finish_time_seconds > 0").fetchone()['c']
              print(f"\n✅ 収集完了!")
              print(f"  全レース: {total_races}件")
              print(f"  全結果: {total_results}件")
              print(f"  タイムあり: {with_time}件 ({with_time/total_results*100:.0f}%)")
          PYEOF

      - name: Save DB cache
        uses: actions/cache/save@v4
        with:
          path: keiba.db
          key: keiba-db-${{ github.run_number }}

      - name: Export updated predictions
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
          python export_predictions.py "$DATE" 2>/dev/null || true

      - name: Deploy to GitHub Pages
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/db_pack.sh || true
          git add docs/data/ keiba.db.gz 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "📭 変更なし"
            exit 0
          fi
          git commit -m "📦 Seed historical data ${{ github.event.inputs.year || '今年' }} $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          # 並行 workflow で main が進んでいる可能性があるため rebase + retry
          # (2026-05-25 修正: 旧 'git push || true' は rejected で 3h 分の作業が消える事故あり)
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git pull --rebase --autostash -X theirs origin main; then
              if git push origin HEAD:main; then
                echo "🚀 deployed (try $i)"
                exit 0
              fi
            else
              # rebase 中の --ours = remote (= backfill前の古いDB) を採用してしまう
              # 自分の scrape したデータを残したいので --theirs を使う
              echo "⚠️ rebase 失敗 (try $i) → keiba.db を theirs (自分の scrape結果) で解決"
              git checkout --theirs keiba.db.gz 2>/dev/null || true
              bash scripts/db_pack.sh || true
              git add keiba.db.gz 2>/dev/null || true
              git rebase --continue 2>/dev/null || git rebase --abort
            fi
            echo "⚠️ push 失敗 → retry ($i/5)"
            sleep $((i * 10))
          done
          echo "❌ push 5回失敗、作業は cache に残る (次回 restore で復元)"
          exit 1
