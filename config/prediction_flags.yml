# 予測・買い目のフラグ (#150, 2026-09-05)
#
# 経緯: これらは GitHub Actions の workflow env にだけ書かれており、
#   auto_post_x.yml と race_day_runner.yml の2本にしか無かった。
#   manual_predict.yml / collect_results.yml / weekday_runner.yml と
#   ローカル復旧 (raceday-health-guard) から予測を回すと、印が黙って
#   別ロジック (☆なし・点数表なし・能力ブレンドなし) になり、
#   同じ日の予想が経路によって違うという状態が起きていた。
#
# そこで既定値をここに集約する。優先順位は
#   環境変数 > このファイル > コード内の既定値
# なので、workflow 側で上書きしたい時は従来どおり env を書けばよい。
#
# ⚠️ 値を変えたら「なぜ変えたか」を CLAUDE.md に必ず記録すること。
#    #72→#73 の規律: バックテストの改善だけで既定 ON にしない。

# ── 印 (コンテンツ層) ──
# #108: オッズ非依存の能力モデルを印スコアに混ぜる比率。
#   ユーザー指示「人気を弱くして」への製品判断。的中改善の根拠は無い。
MARKS_ABILITY_W: "0.5"

# #110/#143: ☆ = 妙味枠 (実オッズ5-20倍でモデル複勝率÷市場率が最大)。
#   印5頭の枠を奪わない別建て。
MARKS_VALUE_TAIKO: "1"

# #147: ◎ をオッズ非依存の加算式「点数表」から選ぶ。
#   OOS 2,688R 実測で ◎3着内 62.4%→56.9%、印5頭の完全捕捉 35.2%→29.5%。
#   = 捕捉を約5.5pt 支払って「なぜこの馬か」を足し算で言えるようにする取引。
MARKS_SCORECARD: "1"

# ── 買い目 (ROI層) ──
# #113: レース適応型の買い目構造 (◎オッズ帯 × 頭数で A/D/G を切り替え)
BET_STRUCTURE_ADAPTIVE: "1"
# #139: 三連単の3列目から注を外す (注の3着セルは回収65%)
BET_D_NO_CHU: "1"
